          description: Единый формат ошибки API для всех ресурсов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/products:
    get:
      operationId: listProducts
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: search
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: priceMin
          in: query
          required: true
          schema:
            type: integer
            format: int32
            default: 0
          explode: false
        - name: priceMax
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
        - name: available
          in: query
          required: false
          schema:
            type: boolean
          explode: false
        - name: page
          in: query
          required: true
          schema:
            type: integer
            format: int32
            default: 1
          explode: false
        - name: pageSize
          in: query
          required: true
          schema:
            type: integer
            format: int32
            default: 12
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        '400':
          description: Единый формат ошибки API для всех ресурсов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Единый формат ошибки API для всех ресурсов.
