components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки.
        message:
          type: string
          description: Человекочитаемое сообщение для пользователя.
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
          description: Детализация по полям, если применимо.
      description: Единый формат ошибки API для всех ресурсов.
    ErrorDetail:
      type: object
      required:
        - message
      properties:
        field:
          type: string
          description: Поле, к которому относится ошибка (может отсутствовать).
        message:
          type: string
          description: Человекочитаемое описание ошибки.
      description: Детализированная ошибка по полю.
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
      description: Проверка работоспособности сервиса.
    Product:
      type: object
      required:
        - id
        - slug
        - name
        - category
        - description
        - price
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int32
        slug:
          type: string
          description: Короткий слаг для URL.
        name:
          type: string
          description: Название товара.
        category:
          type: string
          description: Категория.
        description:
          type: string
          description: Описание.
        price:
          allOf:
            - $ref: '#/components/schemas/rubles'
          description: Цена в рублях.
        imageUrl:
          type: string
          description: URL изображения.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description: Товар каталога.
    ProductList:
      type: object
      required:
        - products
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
      description: Ответ списка товаров.
    SigninRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email — логин покупателя.
        password:
          type: string
          description: Пароль.
      description: Тело запроса входа.
    SignupRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email — логин покупателя. Если адрес уже занят, сервер вернёт 409 EMAIL_TAKEN.
        password:
          type: string
          minLength: 8
          description: Пароль. Минимум 8 символов.
      description: Тело запроса регистрации.
    User:
      type: object
      required:
        - id
        - email
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int32
          description: Уникальный идентификатор пользователя.
        email:
          type: string
          format: email
          description: Email — логин пользователя.
        createdAt:
          type: string
          format: date-time
          description: Дата создания учётной записи.
        updatedAt:
          type: string
          format: date-time
          description: Дата последнего обновления.
      description: "Пользователь магазина: учётная запись и покупатель — одно и то же, отдельной сущности 'клиент' в системе нет."
    rubles:
      type: integer
      format: int32
      minimum: 0
      description: Сумма в рублях — целое число без копеек.
servers:
  - url: http://localhost:3000
    description: Local development server
    variables: {}
