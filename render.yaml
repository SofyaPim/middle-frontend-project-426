services:
  - type: web
    name: pc-components-shop
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pc-components-db
          property: connectionString
      - key: BUGSINK_DSN
        sync: false
      - key: VITE_BUGSINK_DSN
        sync: false

databases:
  - name: pc-components-db
    plan: free
    databaseName: pc_components
    user: pc_components
