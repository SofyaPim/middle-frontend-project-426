services:
  - type: web
    name: pc-components-shop
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pc-components-db
          property: connectionString

databases:
  - name: pc-components-db
    databaseName: pc_components
    user: pc_components
